<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成绩录入 - 鼠智赛事通</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="navbar" id="navbar"></div>

  <div class="container">
    <h1 class="page-title">成绩录入</h1>

    <div class="local-storage-notice">
      <strong>提示</strong>
      录入的成绩先保存在浏览器本地（即时显示），点击"提交到GitHub"按钮同步到 GitHub 后所有设备可见。
    </div>

    <div id="accessDenied" style="display:none;">
      <div class="empty-state">
        <div class="empty-state-icon">🔒</div>
        <p>请以管理员身份登录后访问此页面</p>
      </div>
    </div>

    <div id="adminPanel" style="display:none;">
      <div id="alertBox"></div>

      <!-- 成功反馈面板 -->
      <div id="successPanel" class="card" style="display:none;border:2px solid var(--success,#2d8659);margin-bottom:16px;">
        <div style="color:var(--success,#2d8659);font-size:1.15rem;font-weight:700;margin-bottom:8px;">✅ 成绩录入成功</div>
        <div id="successDetails" style="line-height:1.8;font-size:0.95rem;"></div>
        <div style="display:flex;gap:12px;margin-top:12px;">
          <button class="btn btn-outline" id="btnContinue">继续录入</button>
          <button class="btn btn-primary" id="btnSyncResult">提交到GitHub</button>
          <a href="admin-results-edit.html" class="btn btn-outline">查看成绩记录</a>
        </div>
      </div>

      <div class="card">
        <form id="resultForm">
          <div class="form-group">
            <label for="formMeet">比赛 *</label>
            <select id="formMeet" required>
              <option value="">请选择比赛</option>
            </select>
          </div>
          <div class="form-group">
            <label for="formEvent">项目 *</label>
            <select id="formEvent" required>
              <option value="">请选择项目</option>
            </select>
          </div>
          <div class="form-group">
            <label for="formSwimmer">运动员 *</label>
            <select id="formSwimmer" required>
              <option value="">请选择运动员</option>
            </select>
          </div>
          <div class="form-group">
            <label for="formTime">成绩 *</label>
            <input type="text" id="formTime" placeholder="例如 58.32 或 1:02.35" required>
          </div>
          <div class="form-group">
            <label for="formStatus">成绩状态</label>
            <select id="formStatus">
              <option value="official">正式成绩</option>
              <option value="unofficial">非正式</option>
              <option value="DQ">取消资格 (DQ)</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary btn-block">提交成绩</button>
        </form>
      </div>

      <!-- 最近录入的成绩 -->
      <div class="card" style="margin-top:16px;">
        <h2 class="section-title" style="border:none;margin-bottom:8px;">最近录入</h2>
        <ul class="result-list" id="recentResults">
          <li class="empty-state" style="padding:16px;">暂无录入记录</li>
        </ul>
      </div>

      <!-- 提交到 GitHub 区 -->
      <div class="card" id="syncSection" style="margin-top:16px;display:none;">
        <h2 class="section-title" style="border:none;margin-bottom:8px;">同步到 GitHub</h2>
        <p style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:8px;">以下成绩已保存到本地，点击"全部提交到GitHub"生成 Issue 链接。</p>
        <div id="pendingList" style="margin-bottom:12px;"></div>
        <button class="btn btn-primary" id="btnSubmitAll">全部提交到GitHub</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initPage, escapeHtml, showAlert, formatDate, genderName } from '../assets/js/app.js';
    import { isAdmin } from '../src/services/authService.js';
    import { getAllMeets } from '../src/services/meetService.js';
    import { getAllSwimmers } from '../src/services/swimmerService.js';
    import { getAllEvents } from '../src/services/eventService.js';
    import { getAllResults } from '../src/services/resultService.js';
    import { createResult, getPendingSyncs, clearPendingSyncs, submitBatchToGitHub } from '../src/services/writeService.js';
    import { hasLocalOverrides } from '../src/services/syncService.js';
    import { parseTime, formatTime } from '../src/utils/time.js';
    import { initAllSearchableSelects } from '../src/components/searchableSelect.js';

    initPage();

    let meetNames = {}, eventNames = {}, swimmerNames = {};
    let recentResults = [];
    let pendingOps = [];

    if (!isAdmin()) {
      document.getElementById('accessDenied').style.display = 'block';
      document.getElementById('adminPanel').style.display = 'none';
    } else {
      document.getElementById('accessDenied').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
      init();
    }

    async function init() {
      try {
        const [meets, swimmers, events, results] = await Promise.all([
          getAllMeets(), getAllSwimmers(), getAllEvents(), getAllResults()
        ]);

        meetNames = {};
        meets.forEach(m => meetNames[m.id] = m.name);
        eventNames = {};
        events.forEach(e => eventNames[e.id] = e.name);
        swimmerNames = {};
        swimmers.forEach(s => swimmerNames[s.id] = s.name);

        const meetSel = document.getElementById('formMeet');
        meets.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = `${m.name} (${formatDate(m.date)})`;
          meetSel.appendChild(opt);
        });

        const eventSel = document.getElementById('formEvent');
        events.forEach(e => {
          const opt = document.createElement('option');
          opt.value = e.id;
          opt.textContent = `${e.name} (${genderName(e.gender)})`;
          eventSel.appendChild(opt);
        });

        const swimmerSel = document.getElementById('formSwimmer');
        swimmers.filter(s => s.status === 'active').forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.id;
          opt.textContent = `${s.name}（${s.id}）`;
          swimmerSel.appendChild(opt);
        });

        // 为比赛/项目/运动员选择启用统一搜索组件
        initAllSearchableSelects({
          minLength: 8,
          excludeIds: ['formStatus']
        });

        recentResults = [...results].sort((a, b) =>
          new Date(b.createdAt || 0) - new Date(a.createdAt || 0)
        ).slice(0, 10);
        renderRecent();
        updateSyncSection();
      } catch (err) {
        showAlert('alertBox', '数据加载失败: ' + err.message, 'error');
      }
    }

    document.getElementById('resultForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const meetId = document.getElementById('formMeet').value;
      const eventId = document.getElementById('formEvent').value;
      const swimmerId = document.getElementById('formSwimmer').value;
      const timeInput = document.getElementById('formTime').value;
      const status = document.getElementById('formStatus').value;

      if (!meetId || !eventId || !swimmerId) {
        showAlert('alertBox', '请填写所有必填项', 'warning');
        return;
      }

      let timeMs;
      try {
        timeMs = parseTime(timeInput);
      } catch (err) {
        showAlert('alertBox', err.message, 'error');
        return;
      }

      try {
        const newResult = await createResult({ swimmerId, eventId, meetId, timeMs, status });
        recentResults.unshift(newResult);
        renderRecent();
        document.getElementById('formTime').value = '';

        pendingOps.push({
          action: 'create', entity: 'result',
          data: { id: newResult.id, swimmerId, eventId, meetId, timeMs, status },
          operator: 'admin'
        });
        updateSyncSection();

        const meetName = meetNames[meetId] || meetId;
        const eventName = eventNames[eventId] || eventId;
        const swimmerName = swimmerNames[swimmerId] || swimmerId;
        const statusText = status === 'official' ? '正式' : status === 'unofficial' ? '非正式' : 'DQ';
        document.getElementById('successDetails').innerHTML = `
          <div><strong>运动员：</strong>${escapeHtml(swimmerName)}</div>
          <div><strong>项目：</strong>${escapeHtml(eventName)}</div>
          <div><strong>比赛：</strong>${escapeHtml(meetName)}</div>
          <div><strong>成绩：</strong>${formatTime(timeMs)}</div>
          <div><strong>状态：</strong>${statusText}</div>
          <div><strong>记录ID：</strong>${escapeHtml(newResult.id)}</div>
        `;
        document.getElementById('successPanel').style.display = 'block';
        document.getElementById('alertBox').style.display = 'none';
      } catch (err) {
        showAlert('alertBox', '录入失败: ' + err.message, 'error');
      }
    });

    document.getElementById('btnContinue').addEventListener('click', () => {
      document.getElementById('successPanel').style.display = 'none';
      document.getElementById('resultForm').reset();
    });

    // 成功面板中的"提交到GitHub"按钮
    document.getElementById('btnSyncResult').addEventListener('click', () => {
      const legacy = getPendingSyncs();
      const all = [...legacy, ...pendingOps];
      if (all.length === 0) {
        showAlert('alertBox', '没有待同步的操作', 'info');
        return;
      }
      submitBatchToGitHub(all);
      pendingOps = [];
      clearPendingSyncs();
      updateSyncSection();
      showAlert('alertBox', `已打开 GitHub Issue 页面（含 ${all.length} 项操作），请提交 1 个 Issue 即可。Actions 会一次性同步全部操作（约30-60秒）。`, 'success');
    });

    function renderRecent() {
      const list = document.getElementById('recentResults');
      if (recentResults.length === 0) {
        list.innerHTML = '<li class="empty-state" style="padding:16px;">暂无录入记录</li>';
        return;
      }
      list.innerHTML = recentResults.map(r => `
        <li class="result-item">
          <div class="result-info">
            <div class="result-name">${escapeHtml(swimmerNames[r.swimmerId] || r.swimmerId)}</div>
            <div class="result-detail">
              ${escapeHtml(eventNames[r.eventId] || r.eventId)} · ${escapeHtml(meetNames[r.meetId] || r.meetId)} · ${formatDate(r.createdAt)}
              ${r.status !== 'official' ? `<span class="badge badge-inactive">${r.status}</span>` : ''}
            </div>
          </div>
          <div class="result-time">${formatTime(r.timeMs)}</div>
        </li>
      `).join('');
    }

    function updateSyncSection() {
      const hasLocal = hasLocalOverrides();
      const hasPending = pendingOps.length > 0 || getPendingSyncs().length > 0;
      if (hasLocal.results || hasPending) {
        document.getElementById('syncSection').style.display = 'block';
        const allPending = [...getPendingSyncs(), ...pendingOps];
        const list = allPending.map((p, i) =>
          `<div style="padding:6px 0;border-bottom:1px solid var(--border);">
            ${i+1}. ${p.action} ${p.entity}${p.id ? ' '+p.id : ''}
          </div>`
        ).join('');
        document.getElementById('pendingList').innerHTML = list || '<div style="color:var(--text-secondary);">本地有修改数据</div>';
      } else {
        document.getElementById('syncSection').style.display = 'none';
      }
    }

    document.getElementById('btnSubmitAll').addEventListener('click', () => {
      // 合并 sessionStorage 遗留操作与页面内操作，一次性提交并清空
      const legacy = getPendingSyncs();
      const all = [...legacy, ...pendingOps];
      if (all.length === 0) {
        showAlert('alertBox', '没有待同步的操作', 'info');
        return;
      }
      submitBatchToGitHub(all);
      pendingOps = [];
      clearPendingSyncs();
      updateSyncSection();
      showAlert('alertBox', `已打开 GitHub Issue 页面（含 ${all.length} 项操作），请提交 1 个 Issue 即可。Actions 会一次性同步全部操作（约30-60秒）。`, 'success');
    });
  </script>
</body>
</html>
