<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理中心 - 鼠智赛事通</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="navbar" id="navbar"></div>

  <div class="container">
    <h1 class="page-title">管理中心</h1>

    <div class="security-notice">
      <strong>安全声明</strong>
      当前版本的角色控制属于前端演示级权限，不能视为真正安全的生产级身份认证。管理员写入操作通过 localStorage 保存在当前浏览器，刷新后数据保留，但不同设备间不共享。
    </div>

    <div id="accessDenied" style="display:none;">
      <div class="empty-state">
        <div class="empty-state-icon">🔒</div>
        <p>您当前角色无权访问管理中心</p>
        <p style="font-size:0.85rem;margin-top:8px;">请在右上角切换为管理员角色</p>
      </div>
    </div>

    <div id="adminPanel" style="display:none;">
      <!-- 成绩管理区 -->
      <h2 class="section-title">成绩管理</h2>
      <div class="admin-cards">
        <a href="admin-results-add.html" class="admin-card">
          <div class="admin-card-icon">✏</div>
          <div class="admin-card-title">成绩录入</div>
          <div class="admin-card-desc">录入比赛成绩</div>
        </a>
        <a href="admin-results-edit.html" class="admin-card">
          <div class="admin-card-icon">📋</div>
          <div class="admin-card-title">成绩记录</div>
          <div class="admin-card-desc">查看/修改/标记成绩</div>
        </a>
      </div>

      <!-- SUPER_ADMIN 专属区 -->
      <div class="super-admin-only">
        <h2 class="section-title" style="margin-top:24px;">数据管理（超级管理员）</h2>
        <div class="admin-cards">
          <a href="admin-swimmers.html" class="admin-card">
            <div class="admin-card-icon">👥</div>
            <div class="admin-card-title">运动员管理</div>
            <div class="admin-card-desc">新增/编辑运动员</div>
          </a>
          <a href="admin-meets.html" class="admin-card">
            <div class="admin-card-icon">📅</div>
            <div class="admin-card-title">比赛管理</div>
            <div class="admin-card-desc">新增/编辑比赛</div>
          </a>
          <a href="admin-events.html" class="admin-card">
            <div class="admin-card-icon">🏊</div>
            <div class="admin-card-title">项目管理</div>
            <div class="admin-card-desc">新增/编辑游泳项目</div>
          </a>
        </div>
      </div>

      <!-- localStorage 状态区 -->
      <div class="local-storage-notice" style="margin-top:24px;">
        <strong>localStorage 状态</strong>
        <span id="lsStatus">检查中...</span>
      </div>
    </div>
  </div>

  <script type="module">
    import { initPage } from '../assets/js/app.js';
    import { isAdmin } from '../src/services/authService.js';
    import { hasLocalOverrides, clearLocalOverrides, exportLocalData } from '../src/services/writeService.js';

    initPage();

    if (!isAdmin()) {
      document.getElementById('accessDenied').style.display = 'block';
      document.getElementById('adminPanel').style.display = 'none';
    } else {
      document.getElementById('accessDenied').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';

      // 显示 localStorage 状态
      const overrides = hasLocalOverrides();
      const overrideList = Object.entries(overrides)
        .filter(([, v]) => v)
        .map(([k]) => k);

      const statusEl = document.getElementById('lsStatus');
      if (overrideList.length > 0) {
        statusEl.innerHTML = `已有本地修改数据: ${overrideList.join(', ')}。<br>这些数据仅保存在当前浏览器中，其他设备不可见。`;
      } else {
        statusEl.textContent = '当前无本地修改数据，所有数据来自 JSON 文件。';
      }
    }
  </script>
</body>
</html>
