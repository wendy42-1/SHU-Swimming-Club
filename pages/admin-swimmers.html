<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>运动员管理 - 鼠智赛事通</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="navbar" id="navbar"></div>

  <div class="container">
    <h1 class="page-title">运动员管理</h1>

    <div class="local-storage-notice">
      <strong>提示</strong>
      新增和修改的运动员数据先保存在浏览器本地（即时显示），点击"提交到GitHub"按钮同步到 GitHub 后所有设备可见。
    </div>

    <div id="accessDenied" style="display:none;">
      <div class="empty-state">
        <div class="empty-state-icon">🔒</div>
        <p>请以管理员身份登录后访问此页面</p>
      </div>
    </div>

    <div id="adminPanel" style="display:none;">
      <div id="alertBox"></div>

      <!-- 新增运动员表单 -->
      <div class="card">
        <h2 class="section-title" style="border:none;margin-bottom:8px;">新增运动员</h2>
        <form id="addForm">
          <div class="form-group">
            <label for="swimmerName">姓名 *</label>
            <input type="text" id="swimmerName" placeholder="请输入运动员姓名" required>
          </div>
          <div class="form-group">
            <label for="swimmerGender">性别 *</label>
            <select id="swimmerGender" required>
              <option value="male">男</option>
              <option value="female">女</option>
            </select>
          </div>
          <div class="form-group">
            <label for="swimmerGroup">分组</label>
            <input type="text" id="swimmerGroup" placeholder="自动根据性别填入，可修改">
          </div>
          <div class="form-group">
            <label for="swimmerStatus">状态</label>
            <select id="swimmerStatus">
              <option value="active">活跃</option>
              <option value="inactive">停用</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary btn-block">新增运动员</button>
        </form>
      </div>

      <!-- 运动员列表 -->
      <div class="card" style="margin-top:16px;">
        <h2 class="section-title" style="border:none;margin-bottom:8px;">运动员列表</h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
          <button type="button" class="btn btn-sm filter-tab" data-filter="all" style="padding:6px 14px;">全部</button>
          <button type="button" class="btn btn-sm filter-tab" data-filter="active" style="padding:6px 14px;">在队</button>
          <button type="button" class="btn btn-sm filter-tab" data-filter="inactive" style="padding:6px 14px;">已停用</button>
        </div>
        <input type="text" id="searchInput" class="search-box" placeholder="搜索姓名或ID...">
        <div style="overflow-x:auto;">
          <table class="data-table" id="swimmerTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>姓名</th>
                <th>性别</th>
                <th>分组</th>
                <th>状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="swimmerTableBody">
              <tr><td colspan="6" style="text-align:center;">加载中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 提交到 GitHub 区 -->
      <div class="card" id="syncSection" style="margin-top:16px;display:none;">
        <h2 class="section-title" style="border:none;margin-bottom:8px;">同步到 GitHub</h2>
        <p style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:8px;">以下操作已保存到本地，点击"提交到GitHub"生成 Issue 链接，在 GitHub 创建 Issue 后 Actions 自动同步。</p>
        <div id="pendingList" style="margin-bottom:12px;"></div>
        <button class="btn btn-primary" id="btnSubmitAll">全部提交到GitHub</button>
      </div>
    </div>
  </div>

  <!-- 编辑模态框 -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <div class="modal-header">
        <h2>编辑运动员</h2>
        <button class="modal-close" id="closeModal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>姓名</label>
          <input type="text" id="editName">
        </div>
        <div class="form-group">
          <label>性别</label>
          <select id="editGender">
            <option value="male">男</option>
            <option value="female">女</option>
          </select>
        </div>
        <div class="form-group">
          <label>分组</label>
          <input type="text" id="editGroup">
        </div>
        <div class="form-group">
          <label>状态</label>
          <select id="editStatus">
            <option value="active">活跃</option>
            <option value="inactive">停用</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" id="cancelEdit">取消</button>
        <button class="btn btn-primary" id="saveEdit">保存</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initPage, escapeHtml, showAlert, genderName } from '../assets/js/app.js';
    import { isAdmin } from '../src/services/authService.js';
    import { getAllSwimmers } from '../src/services/swimmerService.js';
    import { getAllResults } from '../src/services/resultService.js';
    import { createSwimmer, updateSwimmer, softDeleteSwimmer, hasSwimmerResults, deleteSwimmerPermanently, getPendingSyncs, clearPendingSyncs, submitBatchToGitHub } from '../src/services/writeService.js';
    import { showHardDeleteConfirm } from '../src/components/confirmModal.js';
    import { hasLocalOverrides } from '../src/services/syncService.js';

    initPage();

    let allSwimmers = [];
    let allResults = [];
    let editingId = null;
    let statusFilter = 'all';
    let pendingOps = [];

    if (!isAdmin()) {
      document.getElementById('accessDenied').style.display = 'block';
      document.getElementById('adminPanel').style.display = 'none';
    } else {
      document.getElementById('accessDenied').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
      loadData();
    }

    async function loadData() {
      try {
        [allSwimmers, allResults] = await Promise.all([getAllSwimmers(), getAllResults()]);
        renderTable();
        updateSyncSection();
      } catch (err) {
        showAlert('alertBox', '加载失败: ' + err.message, 'error');
      }
    }

    function renderTable() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      let swimmers = allSwimmers;
      if (statusFilter === 'active') {
        swimmers = swimmers.filter(s => s.status !== 'inactive');
      } else if (statusFilter === 'inactive') {
        swimmers = swimmers.filter(s => s.status === 'inactive');
      }
      if (search) {
        swimmers = swimmers.filter(s =>
          (s.name || '').toLowerCase().includes(search) ||
          (s.id || '').toLowerCase().includes(search)
        );
      }

      const tbody = document.getElementById('swimmerTableBody');
      if (swimmers.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-secondary);">暂无运动员</td></tr>';
        return;
      }

      tbody.innerHTML = swimmers.map(s => {
        const relatedCount = allResults.filter(r => r.swimmerId === s.id).length;
        const canDeactivate = s.status !== 'inactive';
        return `
        <tr>
          <td>${escapeHtml(s.id)}</td>
          <td>${escapeHtml(s.name)}</td>
          <td>${genderName(s.gender)}</td>
          <td>${escapeHtml(s.group || '')}</td>
          <td>
            <span class="badge ${s.status === 'inactive' ? 'badge-inactive' : 'badge-active'}">
              ${s.status === 'inactive' ? '已停用' : '在队'}
            </span>
          </td>
          <td class="actions">
            <button class="btn btn-outline btn-sm" data-id="${escapeHtml(s.id)}" data-action="edit">编辑</button>
            ${canDeactivate ? `<button class="btn btn-danger btn-sm" data-id="${escapeHtml(s.id)}" data-action="deactivate">停用</button>` : ''}
            <button class="btn btn-danger btn-sm" data-id="${escapeHtml(s.id)}" data-action="delete" data-count="${relatedCount}">删除</button>
          </td>
        </tr>
      `;
      }).join('');

      tbody.querySelectorAll('[data-action="edit"]').forEach(btn => {
        btn.addEventListener('click', () => openEditModal(btn.dataset.id));
      });
      tbody.querySelectorAll('[data-action="deactivate"]').forEach(btn => {
        btn.addEventListener('click', () => deactivateSwimmer(btn.dataset.id));
      });
      tbody.querySelectorAll('[data-action="delete"]').forEach(btn => {
        btn.addEventListener('click', () => removeSwimmer(btn.dataset.id));
      });
    }

    // 停用运动员（软删除，保留历史成绩）
    async function deactivateSwimmer(id) {
      const swimmer = allSwimmers.find(s => s.id === id);
      if (!swimmer) return;
      const hasResults = await hasSwimmerResults(id);
      const confirmMsg = hasResults
        ? `该运动员已有历史成绩，停用后成绩将保留但不再显示在队列表中。\n确定停用 ${swimmer.name} 吗？`
        : `确定停用 ${swimmer.name} 吗？停用后不再显示在队列表中。`;
      if (!confirm(confirmMsg)) return;
      try {
        const updated = await softDeleteSwimmer(id, '管理员停用');
        const idx = allSwimmers.findIndex(s => s.id === id);
        if (idx !== -1) allSwimmers[idx] = updated;
        pendingOps.push({
          action: 'softDelete', entity: 'swimmer', id: id,
          operator: 'admin', reason: '管理员停用'
        });
        renderTable();
        updateSyncSection();
        showAlert('alertBox', `${swimmer.name} 已停用（历史成绩已保留）。点击底部"提交到GitHub"同步。`, 'success');
      } catch (err) {
        showAlert('alertBox', '停用失败: ' + err.message, 'error');
      }
    }

    // 永久删除运动员（v2：物理删除 + 级联删除全部成绩，两步确认）
    async function removeSwimmer(id) {
      const swimmer = allSwimmers.find(s => s.id === id);
      if (!swimmer) return;
      const relatedCount = allResults.filter(r => r.swimmerId === id).length;

      const ok = await showHardDeleteConfirm({
        entityLabel: '运动员',
        name: swimmer.name,
        id,
        resultCount: relatedCount
      });
      if (!ok) return;

      try {
        const { removedResults, operations } = await deleteSwimmerPermanently(id, '管理员永久删除');
        allSwimmers = allSwimmers.filter(s => s.id !== id);
        allResults = allResults.filter(r => r.swimmerId !== id);
        pendingOps.push(...operations);
        renderTable();
        updateSyncSection();
        showAlert('alertBox', `${swimmer.name} 已永久删除（含 ${removedResults} 条关联成绩）。点击底部"提交到GitHub"同步。`, 'success');
      } catch (err) {
        showAlert('alertBox', '删除失败: ' + err.message, 'error');
      }
    }

    // 筛选标签点击
    document.querySelectorAll('.filter-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        statusFilter = btn.dataset.filter;
        document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('btn-primary'));
        btn.classList.add('btn-primary');
        renderTable();
      });
    });
    document.querySelector('.filter-tab[data-filter="all"]').classList.add('btn-primary');

    // 新增运动员
    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('swimmerName').value.trim();
      const gender = document.getElementById('swimmerGender').value;
      let group = document.getElementById('swimmerGroup').value.trim();
      const status = document.getElementById('swimmerStatus').value;

      if (!name) { showAlert('alertBox', '姓名不能为空', 'warning'); return; }
      if (!group) { group = gender === 'female' ? '女子组' : '男子组'; }

      const exists = allSwimmers.some(s => s.name === name && s.gender === gender);
      if (exists) { showAlert('alertBox', `已存在同名同性别运动员: ${name}`, 'warning'); return; }

      try {
        const newSwimmer = await createSwimmer({ name, gender, group, status });
        allSwimmers.push(newSwimmer);
        pendingOps.push({
          action: 'create', entity: 'swimmer',
          data: { id: newSwimmer.id, name, gender, group, status },
          operator: 'admin'
        });
        renderTable();
        updateSyncSection();
        document.getElementById('addForm').reset();
        showAlert('alertBox', `新增成功: ${name} (ID: ${newSwimmer.id})。点击底部"提交到GitHub"同步。`, 'success');
      } catch (err) {
        showAlert('alertBox', '新增失败: ' + err.message, 'error');
      }
    });

    // 搜索
    document.getElementById('searchInput').addEventListener('input', renderTable);

    // 编辑模态框
    function openEditModal(id) {
      const swimmer = allSwimmers.find(s => s.id === id);
      if (!swimmer) return;
      editingId = id;
      document.getElementById('editName').value = swimmer.name || '';
      document.getElementById('editGender').value = swimmer.gender || 'male';
      document.getElementById('editGroup').value = swimmer.group || '';
      document.getElementById('editStatus').value = swimmer.status || 'active';
      document.getElementById('editModal').classList.add('active');
    }

    document.getElementById('closeModal').addEventListener('click', () => {
      document.getElementById('editModal').classList.remove('active');
      editingId = null;
    });
    document.getElementById('cancelEdit').addEventListener('click', () => {
      document.getElementById('editModal').classList.remove('active');
      editingId = null;
    });

    document.getElementById('saveEdit').addEventListener('click', async () => {
      if (!editingId) return;
      const updates = {
        name: document.getElementById('editName').value.trim(),
        gender: document.getElementById('editGender').value,
        group: document.getElementById('editGroup').value.trim(),
        status: document.getElementById('editStatus').value
      };
      if (!updates.name) { showAlert('alertBox', '姓名不能为空', 'warning'); return; }
      try {
        const updated = await updateSwimmer(editingId, updates);
        const idx = allSwimmers.findIndex(s => s.id === editingId);
        if (idx !== -1) allSwimmers[idx] = updated;
        pendingOps.push({
          action: 'update', entity: 'swimmer', id: editingId,
          data: updates, operator: 'admin'
        });
        renderTable();
        updateSyncSection();
        document.getElementById('editModal').classList.remove('active');
        showAlert('alertBox', '修改成功。点击底部"提交到GitHub"同步。', 'success');
        editingId = null;
      } catch (err) {
        showAlert('alertBox', '修改失败: ' + err.message, 'error');
      }
    });

    // 同步区
    function updateSyncSection() {
      const hasLocal = hasLocalOverrides();
      const hasPending = pendingOps.length > 0 || getPendingSyncs().length > 0;

      if (hasLocal.swimmers || hasPending) {
        document.getElementById('syncSection').style.display = 'block';
        const allPending = [...getPendingSyncs(), ...pendingOps];
        const list = allPending.map((p, i) =>
          `<div style="padding:6px 0;border-bottom:1px solid var(--border);">
            ${i+1}. ${p.action} ${p.entity}${p.id ? ' '+p.id : ''}
          </div>`
        ).join('');
        document.getElementById('pendingList').innerHTML = list || '<div style="color:var(--text-secondary);">本地有修改数据</div>';
      } else {
        document.getElementById('syncSection').style.display = 'none';
      }
    }

    document.getElementById('btnSubmitAll').addEventListener('click', () => {
      // 合并 sessionStorage 遗留操作与页面内操作，一次性提交并清空
      const legacy = getPendingSyncs();
      const all = [...legacy, ...pendingOps];
      if (all.length === 0) {
        showAlert('alertBox', '没有待同步的操作', 'info');
        return;
      }
      // 批量提交：合并为 1 个 Issue，一次性同步
      submitBatchToGitHub(all);
      pendingOps = [];
      clearPendingSyncs();
      updateSyncSection();
      showAlert('alertBox', `已打开 GitHub Issue 页面（含 ${all.length} 项操作），请提交 1 个 Issue 即可。Actions 会一次性同步全部操作（约30-60秒）。`, 'success');
    });
  </script>
</body>
</html>
