name: Sync Data

on:
  issues:
    types: [opened]

jobs:
  sync:
    if: contains(github.event.issue.body, '"type":"data-sync"') || contains(github.event.issue.body, '"type":"batch"')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: write
    concurrency:
      group: data-sync
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply data changes
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 .github/scripts/apply_data_change.py

      - name: Validate JSON
        run: |
          for f in data/*.json; do
            if ! python3 -c "import json; json.load(open('$f'))" 2>/dev/null; then
              echo "ERROR: $f is not valid JSON"
              exit 1
            fi
            echo "OK: $f"
          done

      - name: Commit and push (with retry)
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          
          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "No changes to commit (data already up to date)"
            exit 0
          fi
          
          git commit -m "data-sync: issue #${ISSUE_NUMBER}"
          
          # Push with retry: fetch latest, rebase, push
          # Handles concurrent workflows that may have pushed between checkout and push
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i of $MAX_RETRIES..."
            git pull --rebase origin main
            if git push origin main; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            echo "Push failed on attempt $i, retrying..."
            sleep 5
          done
          
          echo "ERROR: Push failed after $MAX_RETRIES attempts"
          exit 1

      - name: Trigger Pages deployment
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy.yml --ref main
          echo "已触发 Deploy to GitHub Pages 工作流"

      - name: Close issue (success)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close ${{ github.event.issue.number }} --comment "✅ 数据已同步，GitHub Pages 正在重新部署（约 30-60 秒）。"

      - name: Close issue (failure)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close ${{ github.event.issue.number }} --comment "❌ 数据同步失败，请检查数据格式后重新提交。本地修改不会丢失，可重新点击提交。"
